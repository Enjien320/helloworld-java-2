name: "Contruction, tests et déployement"

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEPLOY_ENV: production

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Java JDK
        uses: actions/setup-java@v6.2.0
      - name: build maven sans test
        uses: mvn clean package -DskipTests
