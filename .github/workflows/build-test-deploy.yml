name: "Contruction, tests et déployement"

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DEPLOY_ENV: production

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: Setup Java JDK
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: cache
        uses: actions/cache@v5.1.0
        with:
          path: ${{github.workspace}}/.m2/repository
          key: ${{runner.os}}-mavven-${{ hashFiles('**/pom.xml') }}
      - name: build maven sans test
        run: mvn clean package -DskipTests
